<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- One tint for the whole page, and it starts launch-dark.
         iOS colours the strip behind the home indicator from the page, and
         which surface it reads is not observable from a desktop browser, so
         every same-coloured candidate has to stay launch-dark until #launch
         retires: <html> and <body> in the CSS below, and this. #125 let
         applyTheme write the theme's colour here at module init — while the
         W was still on screen — and the light sand came back as a band under
         the W on iPhone, which is what #121 had already fixed once.
         main.ts holds its colour back until the boot script says the overlay
         is gone. Deliberately a single meta: two that both match leave it
         ambiguous which one the phone picks. -->
    <meta name="theme-color" content="#141310" id="app-theme-color" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WealthUp" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- LAUNCH-IMAGES:START (generated by scripts/generate-launch-images.py; do not edit by hand)
         Intentionally empty - see LINK_STARTUP_IMAGES in
         scripts/generate-launch-images.py. The images are still
         built into public/splash; set it to True to link them. -->
    <!-- LAUNCH-IMAGES:END -->
    <title>WealthUp</title>
    <script>
      // Runs before first paint: the same theme choice main.ts makes.
      (function () {
        // Light is the default; only a stored choice moves off it.
        var theme = 'light';
        try {
          var stored = localStorage.getItem('pwo-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      /* The ground the page shows before the app has rendered.
         #141310 on purpose (2026-09-23): it is the colour iOS fills the
         screen with from manifest background_color, so the two agree and
         nothing steps between tapping the icon and the app appearing.
         `:not(.app-ready)` means the theme takes back over by these rules
         ceasing to match, rather than by re-stating its colours. */
      html:not(.app-ready),
      html:not(.app-ready) body { background: #141310; }
      html.app-ready { background: #0b0b0c; }
      html.app-ready[data-theme='light'] { background: #f4f1ea; }
      /* The sign-in page is dark in both themes, but the canvas follows the
         theme — so with the light default <html> and <body> were sand under a
         near-black page, and iOS painted the home-indicator strip from them
         (#121, #132). LOGIN_BG in main.ts covers the third surface, the
         theme-color meta, and toggles `is-login`. */
      html.app-ready.is-login,
      html.app-ready.is-login body { background: #050706; }
      body { margin: 0; }
      /* shell.css styles this properly once it loads; until then keep it off-screen. */
      .skip-link { position: absolute; left: -9999px; }
      /* Shown only when the app could not start and clearing its cached files
         did not help either. With the launch screen gone this is the whole of
         what a stuck load has to say, so it must not depend on anything the
         app loads. */
      #stuck { position: fixed; inset: 0; z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: #141310; color: #f4f1ea; font: 500 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #stuck.is-stuck { display: flex; }
      #stuck p { margin: 0; }
      #stuck button { font: inherit; color: #141310; background: #f4f1ea; border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
      #stuck button:focus-visible { outline: 2px solid #f4f1ea; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="stuck" role="alert"><p>WealthUp could not finish loading.</p><button type="button" id="stuck-reload">Reload</button></div>
    <div id="app"></div>
    <script>
      // The app is on screen as soon as main.ts has put anything in #app: the
      // sign-in page, the new-user Q&A or the app itself. Nothing covers the
      // wait any more — the logo launch screen was removed on request — so
      // this hands the ground over to the theme and, if nothing ever arrives,
      // recovers rather than leaving a dead screen.
      (function () {
        var app = document.getElementById('app');
        var stuck = document.getElementById('stuck');
        // The tint is main.ts's to set — the sign-in page is dark in both
        // themes and wants its own colour, which this script cannot know — so
        // this only announces that the app has taken the screen.
        var markReady = function () {
          if (document.documentElement.classList.contains('app-ready')) return;
          document.documentElement.classList.add('app-ready');
          document.dispatchEvent(new Event('pwo-app-ready'));
        };
        if (!app) return markReady();
        // One attempt per tab, so a failure that a reload cannot fix shows the
        // Reload button instead of reloading round and round.
        var RECOVERY_FLAG = 'pwo-launch-recovered';
        var GIVE_UP_AFTER_MS = 12000;
        var recovering = false;

        var ready = function () {
          recovering = true;
          try { sessionStorage.removeItem(RECOVERY_FLAG); } catch (e) {}
          markReady();
        };

        // An empty #app means main.ts never ran, which on a phone is almost
        // always a cached app shell left pointing at scripts the cache can no
        // longer supply. Clear this app's cached FILES and reload once, so the
        // very first open recovers by itself.
        //
        // Deliberately narrow: only caches named wealth-os-*, and the worker
        // registration. Nothing here touches local storage, IndexedDB or
        // Firestore — that is where the user's own records live, and losing
        // them to a loading problem would be far worse than the problem.
        var recover = function () {
          if (recovering || app.firstElementChild) return;
          recovering = true;
          var alreadyTried = '1';
          try { alreadyTried = sessionStorage.getItem(RECOVERY_FLAG); } catch (e) {}
          if (alreadyTried) { if (stuck) stuck.classList.add('is-stuck'); return; }
          try { sessionStorage.setItem(RECOVERY_FLAG, '1'); } catch (e) {}
          var appFiles = 'caches' in window
            ? caches.keys().then(function (names) {
                return Promise.all(names
                  .filter(function (name) { return name.indexOf('wealth-os-') === 0; })
                  .map(function (name) { return caches.delete(name); }));
              })
            : Promise.resolve();
          var worker = navigator.serviceWorker
            ? navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.map(function (r) { return r.unregister(); }));
              })
            : Promise.resolve();
          Promise.all([appFiles, worker])
            ['catch'](function () {})
            .then(function () { location.reload(); });
        };

        // A script that 404s, or that the cache answered with the wrong file,
        // fires this immediately — no need to wait the timer out.
        window.addEventListener('error', function (event) {
          var element = event.target;
          if (element && element !== window && element.tagName === 'SCRIPT' && element.src) recover();
        }, true);
        setTimeout(recover, GIVE_UP_AFTER_MS);

        var retry = document.getElementById('stuck-reload');
        if (retry) retry.addEventListener('click', function () { location.reload(); });

        if (app.firstElementChild) return ready();
        new MutationObserver(function (records, observer) {
          if (!app.firstElementChild) return;
          observer.disconnect();
          ready();
        }).observe(app, { childList: true });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          const isLocalDevelopment = ['localhost', '127.0.0.1'].includes(location.hostname);

          if (isLocalDevelopment) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));

            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(
                cacheNames
                  .filter((cacheName) => cacheName.startsWith('wealth-os-'))
                  .map((cacheName) => caches.delete(cacheName)),
              );
            }
            return;
          }

          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
