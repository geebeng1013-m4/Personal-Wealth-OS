<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141310" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1ea" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WealthUp" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>WealthUp</title>
    <script>
      // Runs before first paint: the same theme choice main.ts makes, and which
      // skeleton to show while the app's JS loads (see "wealthup-signed-in").
      (function () {
        var theme = 'dark';
        var signedIn = false;
        try {
          var stored = localStorage.getItem('pwo-theme');
          theme = stored === 'light' || stored === 'dark' ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          signedIn = localStorage.getItem('wealthup-signed-in') === '1';
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        if (signedIn) root.classList.add('boot-signed-in');
      })();
    </script>
    <style>
      /* Boot skeleton: visible until main.ts replaces #app's contents. Kept
         inline so it paints before any JS or CSS file arrives. */
      html { background: #0b0b0c; }
      html[data-theme='light'] { background: #f4f1ea; }
      body { margin: 0; }
      /* shell.css styles this properly once it loads; until then keep it off-screen. */
      .skip-link { position: absolute; left: -9999px; }
      .boot { --bone: rgba(255, 255, 255, 0.06); --edge: rgba(255, 255, 255, 0.08); min-height: 100vh; }
      html[data-theme='light'] .boot { --bone: rgba(38, 34, 28, 0.07); --edge: rgba(38, 34, 28, 0.1); }
      .boot-bone { background: var(--bone); border-radius: 16px; animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) { .boot-bone { animation: none; } }
      /* Signed out: a logo-sized mark where the login card will appear. */
      .boot-app { display: none; }
      .boot-login { min-height: 100vh; display: grid; place-items: center; }
      .boot-login .boot-bone { width: 88px; height: 88px; border-radius: 24px; }
      /* Signed in last time: the app's outline — sidebar, title bar, cards. */
      .boot-signed-in .boot-login { display: none; }
      .boot-signed-in .boot-app { display: block; }
      .boot-side { display: none; }
      .boot-main { padding: 20px 16px; display: grid; gap: 16px; }
      .boot-title { height: 36px; width: 40%; border-radius: 12px; }
      .boot-cards { display: grid; gap: 16px; }
      .boot-card { height: 120px; }
      .boot-wide { height: 260px; }
      @media (min-width: 901px) {
        .boot-side { display: block; position: fixed; top: 12px; bottom: 12px; left: 12px; width: 256px; border-radius: 24px; border: 1px solid var(--edge); }
        .boot-main { padding: 28px 32px 28px 312px; gap: 20px; }
        .boot-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
      }
    </style>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="app">
      <div class="boot" aria-busy="true" aria-label="Loading WealthUp">
        <div class="boot-login"><div class="boot-bone"></div></div>
        <div class="boot-app">
          <div class="boot-side boot-bone"></div>
          <div class="boot-main">
            <div class="boot-bone boot-title"></div>
            <div class="boot-cards">
              <div class="boot-bone boot-card"></div>
              <div class="boot-bone boot-card"></div>
              <div class="boot-bone boot-card"></div>
            </div>
            <div class="boot-bone boot-wide"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          const isLocalDevelopment = ['localhost', '127.0.0.1'].includes(location.hostname);

          if (isLocalDevelopment) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));

            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(
                cacheNames
                  .filter((cacheName) => cacheName.startsWith('wealth-os-'))
                  .map((cacheName) => caches.delete(cacheName)),
              );
            }
            return;
          }

          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
