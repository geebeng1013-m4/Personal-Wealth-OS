    <title>WealthUp</title>
    <script>
      // Runs before first paint: the same theme choice main.ts makes.
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('pwo-theme');
          theme = stored === 'light' || stored === 'dark' ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        // Android draws its own splash (background colour + icon) and cannot
        // show the name, so the page leaves it out there too (PLAN.md S-4).
        if (/Android/i.test(navigator.userAgent)) document.documentElement.classList.add('is-android');
      })();
    </script>
    <style>
      /* Launch screen (PLAN.md S-1, S-4): the same picture the phone shows
         before the page arrives — #141310, the white W in the middle and, except
         on Android, the name near the bottom (the iPhone startup images from
         scripts/generate-launch-images.py; Android's own splash is just the W).
         It covers #app until main.ts has rendered and the fonts are in, then
         fades. Inline, so it paints with the HTML. Dark in both themes on
         purpose: it has to match the phone's screen. */
      /* `position: fixed; inset: 0` does not reach the iOS home-indicator safe
         area — iOS fills that strip from the page itself, so in a light theme
         it showed an off-white bar under the W. Which surface it reads is not
         observable from here, so every candidate stays launch-dark until the
         overlay retires: the canvas (html), body (theme.css paints it
         `--surface-bg`, #f4f1ea in light) and the theme-color meta above.
         `:not(.launch-done)` means the theme simply takes back over — these
         rules stop matching rather than hard-coding the theme's colours. */
      html:not(.launch-done),
      html:not(.launch-done) body { background: #141310; }
      html.launch-done { background: #0b0b0c; }
      html.launch-done[data-theme='light'] { background: #f4f1ea; }
      body { margin: 0; }
      /* shell.css styles this properly once it loads; until then keep it off-screen. */
      .skip-link { position: absolute; left: -9999px; }
      #launch { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: #141310; transition: opacity 220ms ease; }
      #launch-mark { width: 120px; height: auto; animation: launch-breathe 1.6s ease-in-out infinite; }
      /* launch-name.png is drawn at 3x; bottom 9% matches the startup images. */
      #launch-name { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); width: 77px; height: auto; }
      .is-android #launch-name { display: none; }
      #launch.is-done { opacity: 0; pointer-events: none; }
      @keyframes launch-breathe { 50% { transform: scale(0.95); } }
      /* Shown only when the app could not start and clearing its cached files
         did not help either, so the launch screen never becomes a dead end. */
      #launch-retry { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); width: min(280px, 80vw); display: none; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: #f4f1ea; font: 500 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      #launch.is-stuck #launch-retry { display: flex; }
      #launch-retry p { margin: 0; }
      #launch-retry button { font: inherit; color: #141310; background: #f4f1ea; border: 0; border-radius: 999px; padding: 10px 22px; cursor: pointer; }
      #launch-retry button:focus-visible { outline: 2px solid #f4f1ea; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { #launch { transition: none; } #launch-mark { animation: none; } }
    </style>

    <script>
      // Retire the launch screen once main.ts has put anything in #app: the
      // sign-in page, the new-user Q&A or the app. No minimum time on screen.
      // If nothing ever arrives, recover rather than sit on the W for ever.
      (function () {
        var launch = document.getElementById('launch');
        var app = document.getElementById('app');
        // Hands the page back to the theme; until then it stays launch-dark.
        var restoreThemeBackground = function () {
          document.documentElement.classList.add('launch-done');
          var launchTint = document.getElementById('launch-theme-color');
          if (launchTint && launchTint.parentNode) launchTint.parentNode.removeChild(launchTint);
        };
        if (!launch || !app) return restoreThemeBackground();
        // One attempt per tab, so a failure that a reload cannot fix shows the
        // retry button instead of reloading round and round.
        var RECOVERY_FLAG = 'pwo-launch-recovered';
        var GIVE_UP_AFTER_MS = 12000;
        var recovering = false;
        var fade = function () {
          if (launch.classList.contains('is-done')) return;
          launch.classList.add('is-done');
          var remove = function () {
            if (launch.parentNode) launch.parentNode.removeChild(launch);
            restoreThemeBackground();
          };
          launch.addEventListener('transitionend', remove);
          setTimeout(remove, 400);
        };
        // Fade only once the app's fonts are in, so the first Overview the
        // user sees does not swap typefaces under the fade. Capped: a slow
        // font must not hold the app behind the W.
        var done = function () {
          recovering = true;
          try { sessionStorage.removeItem(RECOVERY_FLAG); } catch (e) {}
          if (!document.fonts || !document.fonts.ready) return fade();
          var capped = setTimeout(fade, 800);
          // Two frames first: the browser only starts fetching a font once a
          // layout has asked for it, and until then fonts.ready is already
          // resolved with nothing to wait for.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              document.fonts.ready.then(function () { clearTimeout(capped); fade(); }, fade);
            });
          });
        };

        // An empty #app means main.ts never ran, which on a phone is almost
        // always a cached app shell left pointing at scripts the cache can no
        // longer supply. Clear this app's cached FILES and reload once, so the
        // very first open recovers by itself.
        //
        // Deliberately narrow: only caches named wealth-os-*, and the worker
        // registration. Nothing here touches local storage, IndexedDB or
        // Firestore — that is where the user's own records live, and losing
        // them to a loading problem would be far worse than the problem.
        var recover = function () {
          if (recovering || app.firstElementChild) return;
          recovering = true;
          var alreadyTried = '1';
          try { alreadyTried = sessionStorage.getItem(RECOVERY_FLAG); } catch (e) {}
          if (alreadyTried) { launch.classList.add('is-stuck'); return; }
          try { sessionStorage.setItem(RECOVERY_FLAG, '1'); } catch (e) {}
          var appFiles = 'caches' in window
            ? caches.keys().then(function (names) {
                return Promise.all(names
                  .filter(function (name) { return name.indexOf('wealth-os-') === 0; })
                  .map(function (name) { return caches.delete(name); }));
              })
            : Promise.resolve();
          var worker = navigator.serviceWorker
            ? navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.map(function (r) { return r.unregister(); }));
              })
            : Promise.resolve();
          Promise.all([appFiles, worker])
            ['catch'](function () {})
            .then(function () { location.reload(); });
        };

        // A script that 404s, or that the cache answered with the wrong file,
        // fires this immediately — no need to wait the timer out.
        window.addEventListener('error', function (event) {
          var element = event.target;
          if (element && element !== window && element.tagName === 'SCRIPT' && element.src) recover();
        }, true);
        setTimeout(recover, GIVE_UP_AFTER_MS);

        var retry = document.getElementById('launch-retry-button');
        if (retry) retry.addEventListener('click', function () { location.reload(); });

        if (app.firstElementChild) return done();
        new MutationObserver(function (records, observer) {
          if (!app.firstElementChild) return;
          observer.disconnect();
          done();
        }).observe(app, { childList: true });
      })();
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          const isLocalDevelopment = ['localhost', '127.0.0.1'].includes(location.hostname);

          if (isLocalDevelopment) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));

            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(
                cacheNames
                  .filter((cacheName) => cacheName.startsWith('wealth-os-'))
                  .map((cacheName) => caches.delete(cacheName)),
              );
            }
            return;
          }

          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {});
        });
      }
    </script>
