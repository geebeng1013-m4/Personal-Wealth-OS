<!doctype html>
<!--
  Source of public/og-image.jpg, the picture WhatsApp, Telegram and other apps
  show under a shared wealthup.cc or demo.wealthup.cc link.

  To regenerate: serve personal-wealth-os/ (e.g. `npx vite` from there), open
  /scripts/og-image/og-image.html in a 1200x630 viewport and save a JPEG
  screenshot as public/og-image.jpg. Keep it under 300 KB — WhatsApp drops
  larger previews. overview.png is the demo's Overview (Daniel, fictional data).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Inter";
    src: url("/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
  }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(87, 167, 143, 0.28), transparent 60%),
      radial-gradient(700px 420px at -10% 110%, rgba(199, 155, 87, 0.16), transparent 60%),
      #0b0d0c;
    font-family: "Inter", system-ui, sans-serif;
    color: #ededf0;
  }
  .copy {
    position: absolute;
    left: 72px;
    top: 0;
    bottom: 0;
    width: 430px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 76px; height: 76px; border-radius: 20px; }
  .brand span { font-size: 46px; font-weight: 750; letter-spacing: -0.02em; }
  h1 {
    margin: 0;
    font-size: 40px;
    line-height: 1.18;
    font-weight: 680;
    letter-spacing: -0.015em;
  }
  .tagline { font-size: 22px; color: #9ed3c1; font-weight: 560; }
  .tagline i { font-style: normal; color: rgba(158, 211, 193, 0.55); margin: 0 0.35em; }
  .shot {
    position: absolute;
    left: 548px;
    top: 92px;
    width: 800px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="/brand/wealth-mark.png" alt=""><span>WealthUp</span></div>
    <h1>Your money, investments and goals, all in one place.</h1>
    <div class="tagline">Track<i>•</i>Grow<i>•</i>Compound</div>
  </div>
  <img class="shot" src="overview.png" alt="">
</body>
</html>
